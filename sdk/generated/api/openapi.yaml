openapi: 3.0.3
info:
  contact:
    name: Bridge-Watch Team
    url: https://github.com/StellaBridge/Bridge-Watch
  description: |-
    Real-time Stellar bridge monitoring API. Provides bridge statuses, asset health, liquidity, price feeds, alert management, analytics, and administrative controls.

    ## Authentication
    Protected endpoints require an API key in the `x-api-key` header.

    ## Rate Limiting
    All endpoints are rate-limited per IP using a sliding-window algorithm backed by Redis. Exceeding the limit returns **429 Too Many Requests** with a `Retry-After` header.

    ## Versioning
    All REST endpoints are prefixed with `/api/v1/`. Breaking changes increment the version segment.

    ## Error Format
    ```json
    { "error": "Short label", "message": "Human-readable description" }
    ```
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Bridge-Watch API
  version: 1.0.0
servers:
- description: Local development
  url: http://localhost:3000
- description: Production
  url: https://api.bridge-watch.io
tags:
- description: Service health check
  name: Health
- description: "Asset prices, liquidity, and health scores"
  name: Assets
- description: Stellar bridge status and statistics
  name: Bridges
- description: Alert rule management and history (requires API key)
  name: Alerts
- description: Protocol-wide and per-asset analytics
  name: Analytics
- description: "Time-series aggregation of prices, health, and volume"
  name: Aggregation
- description: "Asset metadata — logos, descriptions, social links"
  name: Metadata
- description: User watchlists
  name: Watchlists
- description: User preference storage
  name: Preferences
- description: Background job queue monitoring and control
  name: Jobs
- description: Runtime configuration and feature flags
  name: Config
- description: Redis cache inspection and invalidation
  name: Cache
- description: Automated circuit-breaker pause controls
  name: Circuit Breaker
