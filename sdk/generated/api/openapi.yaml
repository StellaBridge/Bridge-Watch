components:
  schemas:
    Error:
      example:
        error: Not Found
        message: The requested resource was not found
      properties:
        error:
          example: Not Found
          type: string
        message:
          example: The requested resource was not found
          type: string
      type: object
    HealthScore:
      example:
        symbol: USDC
        score: 87.5
        status: healthy
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        symbol:
          example: USDC
          type: string
        score:
          example: 87.5
          format: float
          maximum: 100
          minimum: 0
          type: number
        status:
          enum:
          - healthy
          - warning
          - critical
          example: healthy
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    AlertRule:
      properties:
        id:
          format: uuid
          type: string
        ownerAddress:
          type: string
        name:
          type: string
        assetCode:
          type: string
        conditions:
          items:
            type: object
          type: array
        conditionOp:
          enum:
          - AND
          - OR
          type: string
        priority:
          enum:
          - low
          - medium
          - high
          - critical
          type: string
        cooldownSeconds:
          type: integer
        webhookUrl:
          format: uri
          type: string
        isActive:
          type: boolean
        createdAt:
          format: date-time
          type: string
      type: object
    Watchlist:
      properties:
        id:
          format: uuid
          type: string
        userId:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        assets:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
      type: object
    _health_get_200_response:
      example:
        status: ok
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        status:
          example: ok
          type: string
        timestamp:
          format: date-time
          type: string
      type: object
    _api_v1_assets_get_200_response:
      example:
        total: 0
        assets:
        - "{}"
        - "{}"
      properties:
        assets:
          items:
            type: object
          type: array
        total:
          example: 0
          type: integer
      type: object
    _api_v1_alerts_rules_post_request:
      properties:
        ownerAddress:
          type: string
        name:
          example: USDC health drop
          type: string
        assetCode:
          example: USDC
          type: string
        conditions:
          items:
            type: object
          type: array
        conditionOp:
          default: AND
          enum:
          - AND
          - OR
          type: string
        priority:
          default: medium
          enum:
          - low
          - medium
          - high
          - critical
          type: string
        cooldownSeconds:
          default: 300
          type: integer
        webhookUrl:
          format: uri
          type: string
      required:
      - assetCode
      - conditions
      - name
      - ownerAddress
      type: object
    _api_v1_alerts_rules__ruleId__delete_request:
      properties:
        ownerAddress:
          type: string
      required:
      - ownerAddress
      type: object
    _api_v1_alerts_rules__ruleId__active_patch_request:
      properties:
        ownerAddress:
          type: string
        isActive:
          type: boolean
      required:
      - isActive
      - ownerAddress
      type: object
    _api_v1_alerts_test_post_request:
      properties:
        rule:
          type: object
        metrics:
          type: object
      required:
      - metrics
      - rule
      type: object
    _api_v1_analytics_cache_invalidate_post_request:
      properties:
        pattern:
          type: string
      type: object
    _api_v1_metadata__assetId__logo_patch_request:
      properties:
        logoUrl:
          format: uri
          type: string
        updatedBy:
          type: string
      required:
      - logoUrl
      - updatedBy
      type: object
    _api_v1_watchlists__userId__post_request:
      properties:
        name:
          type: string
        isDefault:
          type: boolean
      required:
      - name
      type: object
    _api_v1_preferences__userId___category___key__put_request:
      properties:
        value: {}
      required:
      - value
      type: object
    _api_v1_config__key__delete_request:
      properties:
        deletedBy:
          type: string
      required:
      - deletedBy
      type: object
    _api_v1_cache_invalidate_post_request:
      properties:
        tag:
          type: string
        key:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: API key for protected endpoints
      in: header
      name: x-api-key
      type: apiKey
