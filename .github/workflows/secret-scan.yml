name: Secret Scanning with Gitleaks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Comment on PR if secrets found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Secret Scanning Alert**\n\nGitleaks detected potential secrets in this PR. Please review the scan results above and remove any sensitive information before merging.\n\n**What to do:**\n1. Review the detected secrets in the CI logs\n2. Remove or rotate any compromised credentials\n3. Use `git filter-branch` or `git-filter-repo` to clean git history if needed\n4. Force-push the cleaned branch\n5. See CONTRIBUTING.md for detailed remediation steps'
            })
