name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "lighthouserc.js"
      - ".github/workflows/lighthouse.yml"

jobs:
  lighthouse:
    name: Lighthouse CI Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.js
          uploadArtifacts: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

      - name: Comment PR with Lighthouse Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportDir = '.lighthouseci';
            if (!fs.existsSync(reportDir)) {
              console.log('No Lighthouse report found');
              return;
            }
            const files = fs.readdirSync(reportDir);
            const htmlFiles = files.filter(f => f.endsWith('.html'));
            if (htmlFiles.length === 0) {
              console.log('No HTML reports found');
              return;
            }
            let comment = '## 🏎️ Lighthouse CI Performance Report\n\n';
            for (const file of htmlFiles) {
              const url = `https://htmlpreview.github.io/?${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/blob/${process.env.GITHUB_SHA}/${reportDir}/${file}`;
              comment += `- [${file}](${url})\n`;
            }
            comment += '\n_See [Lighthouse CI Action](https://github.com/treosh/lighthouse-ci-action) for details._';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });