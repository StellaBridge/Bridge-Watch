apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-watch-backend-policy
  namespace: bridge-watch
spec:
  podSelector:
    matchLabels:
      app: bridge-watch-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: bridge-watch-frontend
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # DNS resolution for external service discovery
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # PostgreSQL database access
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis cache access
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # External APIs (Stellar Horizon, RPC nodes, Circle, Coinbase) - HTTPS
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Block metadata IP - no rule for 169.254.169.254
    # Deny implicit default via empty to: [] without ports for port 80 is unnecessary
    # since we explicitly define only required ports above

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-watch-frontend-policy
  namespace: bridge-watch
spec:
  podSelector:
    matchLabels:
      app: bridge-watch-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution for service discovery
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Backend API access
    - to:
        - podSelector:
            matchLabels:
              app: bridge-watch-backend
      ports:
        - protocol: TCP
          port: 3001
    # Allow external HTTPS traffic for external APIs if needed
    - to: []
      ports:
        - protocol: TCP
          port: 443
